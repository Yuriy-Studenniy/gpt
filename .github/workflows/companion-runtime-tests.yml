name: Тесты внешнего Runtime

on:
  push:
    branches:
      - world-model-completion
  pull_request:
    branches:
      - world-model-completion
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Проверить синтаксис Python
        run: python -m compileall -q companion_runtime tools/gpt_companion_ipc_probe.py tests
      - name: Запустить тесты Runtime
        run: python -m unittest discover -s tests -p "test_*.py" -v
